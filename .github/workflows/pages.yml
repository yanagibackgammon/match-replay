name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate manifests
        shell: bash
        run: |
          mkdir -p matches ads
          python - <<'PY'
          import json
          from pathlib import Path

          match_root = Path("matches")
          match_files = sorted(
              p.name for p in match_root.iterdir()
              if p.is_file()
              and p.suffix.lower() in {".xg", ".json"}
              and p.name != "manifest.json"
          )

          generated = {}
          generated_root = match_root / "generated"
          if generated_root.exists():
              for src in match_files:
                  if src.lower().endswith(".xg"):
                      candidate = generated_root / f"{src}.json"
                      if candidate.is_file():
                          generated[src] = f"generated/{candidate.name}"

          match_payload = {
              "activeFile": "",
              "files": match_files,
              "generated": generated,
          }
          (match_root / "manifest.json").write_text(
              json.dumps(match_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Generated match manifest with {len(match_files)} file(s).")

          ad_root = Path("ads")
          ad_files = sorted(
              p.name for p in ad_root.iterdir()
              if p.is_file()
              and p.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".gif"}
          )
          ad_payload = {"files": ad_files}
          (ad_root / "manifest.json").write_text(
              json.dumps(ad_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Generated ad manifest with {len(ad_files)} file(s).")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
