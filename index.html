<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backgammon Auto Replay - Prototype</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage-wrap">
  <main id="stage" aria-label="1920 by 1080 stream layout">
    <section class="winrate-area">
      <div class="winrate-strip">
        <div class="bar-name bar-name-left">柳 暢祐</div>

        <div class="winrate-main">
          <div class="winrate-card">
            <div class="winrate-bar">
              <div id="winBarBlack" class="winrate-fill black" style="width:50%"></div>
              <div id="winBarWhite" class="winrate-fill white" style="width:50%"></div>
              <div id="blackRateText" class="bar-rate bar-rate-left">50.0%</div>
              <div id="whiteRateText" class="bar-rate bar-rate-right">50.0%</div>
            </div>
          </div>
        </div>

        <div class="bar-name bar-name-right">平林 直</div>
      </div>
    </section>

    <section class="board-area">
      <div class="board-shell">
        <svg id="board" viewBox="0 0 702 546" role="img" aria-label="Backgammon board">
          <rect width="702" height="546" fill="#ffffff"/>
          <g id="boardBase" stroke="#000000" stroke-linejoin="round">
            <rect x="11" y="28" width="680" height="490" fill="#ffffff" stroke-width="4"/>
            <line x1="58.5" y1="28" x2="58.5" y2="518" stroke-width="4"/>
            <line x1="326.5" y1="28" x2="326.5" y2="518" stroke-width="4"/>
            <line x1="374.5" y1="28" x2="374.5" y2="518" stroke-width="4"/>
            <line x1="644.5" y1="28" x2="644.5" y2="518" stroke-width="4"/>
            <rect x="10.5" y="247" width="48" height="53" fill="#000000" stroke-width="0"/>
            <rect x="645.5" y="247" width="46" height="53" fill="#000000" stroke-width="0"/>
          </g>
          <g id="points"></g>
          <g id="pointLabels"></g>
          <g id="checkers"></g>
          <g id="dice"></g>
          <g id="cube"></g>
        </svg>
      </div>

      <aside class="replay-panel">
        <section class="panel current-panel">
          <div class="big-action" id="bigAction">GAME START</div>
          <div class="current-sub">XG SOURCE / AUTO REPLAY PROTOTYPE</div>
        </section>

        <section class="panel move-panel">
          <div class="panel-heading">MOVE LIST</div>
          <div id="moveList" class="move-list"></div>
        </section>
      </aside>
    </section>

    <footer class="title-area">
      <div class="title-main" id="tournamentTitle">第31期名人戦 準々決勝</div>

      <div class="bottom-controls">
        <button id="prevBtn" aria-label="previous">◀</button>
        <button id="playBtn" class="play">▶ PLAY</button>
        <button id="nextBtn" aria-label="next">▶</button>

        <div class="timeline-wrap">
          <input id="timeline" type="range" min="0" max="5" step="1" value="0">
          <div class="timeline-label">
            <span id="stepLabel">1 / 6</span>
            <span id="diceText">—</span>
          </div>
        </div>

        <label class="speed">SPEED
          <select id="speed">
            <option value="2500">0.5×</option>
            <option value="1500" selected>1×</option>
            <option value="800">2×</option>
          </select>
        </label>
      </div>
    </footer>
  </main>
</div>
<script src="./app.js"></script>
</body>
</html>
