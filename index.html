<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backgammon Match Replay</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage-wrap">
  <main id="stage" aria-label="1920 by 1080 stream layout">
    <section class="top-area">
      <div class="top-title" id="tournamentTitle">JBS第31期名人戦 準々決勝　25ptマッチ</div>

      <div class="top-strip">
        <div class="player-card player-left">
          <div class="player-name">柳 暢祐</div>
          <div class="player-score-box">
            <span>SCORE</span>
            <strong id="blackScore">0</strong>
          </div>
        </div>

        <div class="eval-wrap">
          <div class="winrate-bar">
            <div id="winBarBlack" class="winrate-fill black" style="width:50%"></div>
            <div id="winBarWhite" class="winrate-fill white" style="width:50%"></div>
            <div id="blackRateText" class="bar-rate bar-rate-left">50.0%</div>
            <div id="whiteRateText" class="bar-rate bar-rate-right">50.0%</div>
          </div>
        </div>

        <div class="player-card player-right">
          <div class="player-name">平林 直</div>
          <div class="player-score-box">
            <span>SCORE</span>
            <strong id="whiteScore">0</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="main-area">
      <section class="board-area">
        <svg id="board" viewBox="0 0 702 546" role="img" aria-label="Backgammon board">
          <rect width="702" height="546" fill="#ffffff"/>
          <g id="boardBase" stroke="#000000" stroke-linejoin="round">
            <rect x="11" y="28" width="680" height="490" fill="#ffffff" stroke-width="4"/>
            <line x1="58.5" y1="28" x2="58.5" y2="518" stroke-width="4"/>
            <line x1="326.5" y1="28" x2="326.5" y2="518" stroke-width="4"/>
            <line x1="374.5" y1="28" x2="374.5" y2="518" stroke-width="4"/>
            <line x1="644.5" y1="28" x2="644.5" y2="518" stroke-width="4"/>
            <rect x="10.5" y="247" width="48" height="53" fill="#000000" stroke-width="0"/>
            <rect x="645.5" y="247" width="46" height="53" fill="#000000" stroke-width="0"/>
          </g>
          <g id="points"></g>
          <g id="pointLabels"></g>
          <g id="checkers"></g>
          <g id="dice"></g>
          <g id="cube"></g>
        </svg>
      </section>

      <aside class="info-area">
        <section class="panel current-panel">
          <div class="panel-heading">CURRENT</div>
          <div class="big-action" id="bigAction">GAME START</div>
          <div class="current-sub">XG SOURCE / AUTO REPLAY PROTOTYPE</div>
        </section>

        <section class="panel move-panel">
          <div class="panel-heading">MOVE LIST</div>
          <div id="moveList" class="move-list"></div>
        </section>
      </aside>
    </section>
  </main>
</div>
<script src="./app.js"></script>
</body>
</html>
