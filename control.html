<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Replay Control</title>
<link rel="stylesheet" href="./control.css?v=53">
</head>
<body>
<main class="control-shell">
  <header class="control-header">
    <h1>MATCH REPLAY <span>操作画面</span></h1>
    <div id="connection" class="connection offline">DISCONNECTED</div>
  </header>

  <section class="match-card">
    <div class="match-file-row">
      <label class="match-file-field">
        <select id="matchFileSelect" aria-label="棋譜ファイル">
          <option value="">(未選択)</option>
        </select>
      </label>
      <div class="match-actions">
        <button id="refreshMatchesBtn">棋譜一覧 更新</button>
        <button id="applyMetaBtn" class="primary">表示へ反映</button>
      </div>
    </div>
    <div class="loaded-file">
      <span>PAGES MODE</span>
      <strong id="loadedFileName">未選択</strong>
    </div>
  </section>

  <section class="status-card">
    <div class="status-summary">
      <span>現在位置</span><strong id="stepText">1 / 1</strong>
      <span class="status-divider">再生状態</span><strong id="playState">一時停止</strong>
    </div>
    <div class="timeline-block">
      <div class="timeline-wrap">
        <div id="gameMarkers" class="game-markers" aria-hidden="true"></div>
        <input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="棋譜位置">
      </div>
    </div>
  </section>

  <section class="mode-card">
    <div class="playback-buttons">
      <button id="autoModeBtn" class="active">自動</button>
      <button id="manualModeBtn">手動</button>
      <button id="prevBtn">◀ 前へ</button>
      <button id="playBtn" class="primary">▶ 再生</button>
      <button id="pauseBtn">Ⅱ 停止</button>
      <button id="nextBtn">次へ ▶</button>
    </div>
  </section>

  <section class="meta-card">
    <div class="meta-grid">
      <label>
        <span>試合名</span>
        <input id="tournamentLine1Input" type="text" value="">
      </label>
      <label>
        <span>試合補足</span>
        <input id="tournamentLine2Input" type="text" value="">
      </label>
      <label>
        <span>テーマカラー</span>
        <input id="themeColorInput" type="text" value="#6B670D" placeholder="#6B670D" maxlength="7" spellcheck="false">
        <div id="themeColorPreview" class="theme-color-preview" aria-label="テーマカラーのプレビュー"></div>
      </label>
      <label>
        <span>ボードデザイン</span>
        <select id="designPresetSelect">
          <option value="classic">クラシック（黒・白）</option>
        </select>
        <div id="designPresetPreview" class="design-preset-preview" aria-label="選択中デザインの配色"></div>
      </label>
      <label>
        <span>選手1</span>
        <input id="blackNameInput" type="text" value="">
      </label>
      <label>
        <span>選手2</span>
        <input id="whiteNameInput" type="text" value="">
      </label>
    </div>
  </section>

  <section class="info-card">
    <p>OBS Browser Source</p>
    <code>http://localhost:3000/</code>
    <p>この操作画面</p>
    <code>http://localhost:3000/control.html</code>
    <p>GitHub / ローカルで棋譜を置くフォルダ</p>
    <code>/matches/</code>
  </section>
</main>
<script src="./control.js?v=53"></script>
</body>
</html>
