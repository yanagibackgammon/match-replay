<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Replay Control</title>
<link rel="stylesheet" href="./control.css?v=170">
</head>
<body>
<main class="control-shell">
  <header class="control-header">
    <h1>MATCH REPLAY <span>操作画面</span></h1>
    <div id="connection" class="connection offline" hidden>DISCONNECTED</div>
  </header>

  <section class="mode-card">
    <div class="playback-buttons">
      <button id="autoNormalModeBtn">自動再生 ▶</button>
      <button id="autoDoubleModeBtn">倍速再生 ▶</button>
      <button id="prevBtn">◀ 手動・前</button>
      <button id="nextBtn">手動・次 ▶</button>
      <button id="pauseBtn" class="active">Ⅱ 停止</button>
    </div>
  </section>

  <section class="status-card">
    <div class="status-summary">
      <span>現在位置</span><strong id="stepText">1 / 1</strong>
      <span class="status-divider">ゲーム位置</span><strong id="gamePosition">1 / 1</strong>
      <span class="status-divider">残り時間</span><strong id="remainingTime">0:00</strong>
    </div>
    <div class="timeline-block">
      <div class="timeline-wrap">
        <div id="gameMarkers" class="game-markers"></div>
        <input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="棋譜位置">
      </div>
    </div>
    <div class="loaded-file">
      <span>PAGES MODE</span>
      <strong id="loadedFileName">未選択</strong>
    </div>
  </section>

  <section class="meta-card">
    <div class="match-file-row">
      <label class="match-file-field">
        <select id="matchFileSelect" aria-label="棋譜ファイル">
          <option value="">(未選択)</option>
        </select>
      </label>
      <div class="match-actions">
        <button id="refreshMatchesBtn">棋譜一覧 更新</button>
        <button id="applyMetaBtn" class="primary">表示へ反映</button>
      </div>
    </div>
    <div class="meta-grid">
      <label>
        <span>試合名</span>
        <input id="tournamentLine1Input" type="text" value="">
      </label>
      <label>
        <span>試合補足</span>
        <input id="tournamentLine2Input" type="text" value="">
      </label>
      <label>
        <span>テーマカラー</span>
        <div class="theme-color-input-row">
          <input id="themeColorInput" type="text" value="#6B670D" placeholder="#6B670D" maxlength="7" spellcheck="false">
          <span id="themeColorSwatch" class="theme-color-swatch" aria-label="入力中のテーマカラー"></span>
        </div>
        <div id="themeColorPreview" class="theme-color-preview" aria-label="テーマカラーのプリセット">
          <button type="button" class="theme-color-button" data-color="#3C3C3C" aria-label="日 #3C3C3C">日</button>
          <button type="button" class="theme-color-button" data-color="#6B0D2F" aria-label="盤 #6B0D2F">盤</button>
          <button type="button" class="theme-color-button" data-color="#6B670D" aria-label="名 #6B670D">名</button>
          <button type="button" class="theme-color-button" data-color="#0D6B2F" aria-label="王 #0D6B2F">王</button>
          <button type="button" class="theme-color-button" data-color="#0D236B" aria-label="賽 #0D236B">賽</button>
          <button type="button" class="theme-color-button" data-color="#6B230D" aria-label="棋 #6B230D">棋</button>
          <button type="button" class="theme-color-button" data-color="#6B0D5B" aria-label="女 #6B0D5B">女</button>
          <button type="button" class="theme-color-button" data-color="#0D676B" aria-label="新 #0D676B">新</button>
        </div>
      </label>
      <label>
        <span>ボードデザイン</span>
        <select id="designPresetSelect">
          <option value="green">グリーン</option>
        </select>
        <div id="designPresetPreview" class="design-preset-preview" aria-label="選択中デザインの配色"></div>
      </label>
      <label>
        <span>選手1</span>
        <input id="blackNameInput" type="text" value="">
      </label>
      <label>
        <span>選手2</span>
        <input id="whiteNameInput" type="text" value="">
      </label>
    </div>
  </section>

  <section class="info-card">
    <p>OBS Browser Source</p>
    <code>http://localhost:3000/</code>
    <p>この操作画面</p>
    <code>http://localhost:3000/control.html</code>
    <p>GitHub / ローカルで棋譜を置くフォルダ</p>
    <code>/matches/</code>
  </section>
</main>
<script src="./control.js?v=167"></script>
</body>
</html>
