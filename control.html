<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Replay Control</title>
<link rel="stylesheet" href="./control.css">
</head>
<body>
<main class="control-shell">
  <header class="control-header">
    <div>
      <p>MATCH REPLAY</p>
      <h1>操作画面</h1>
    </div>
    <div id="connection" class="connection offline">DISCONNECTED</div>
  </header>

  <section class="status-card">
    <div class="status-row">
      <span>現在位置</span>
      <strong id="stepText">1 / 6</strong>
    </div>
    <div class="status-row">
      <span>再生状態</span>
      <strong id="playState">PAUSE</strong>
    </div>
  </section>

  <section class="transport">
    <button id="prevBtn">◀ 前へ</button>
    <button id="playBtn" class="primary">▶ 再生</button>
    <button id="pauseBtn">Ⅱ 停止</button>
    <button id="nextBtn">次へ ▶</button>
  </section>

  <section class="seek-card">
    <label for="timeline">棋譜位置</label>
    <input id="timeline" type="range" min="0" max="5" step="1" value="0">
  </section>

  <section class="speed-card">
    <span>再生速度</span>
    <div class="speed-buttons">
      <button data-speed="2500">0.5×</button>
      <button data-speed="1500" class="active">1×</button>
      <button data-speed="800">2×</button>
    </div>
  </section>

  <section class="meta-card">
    <div class="meta-grid">
      <label>
        <span>大会名</span>
        <input id="tournamentInput" type="text" value="">
      </label>
      <label>
        <span>黒プレイヤー名</span>
        <input id="blackNameInput" type="text" value="">
      </label>
      <label>
        <span>白プレイヤー名</span>
        <input id="whiteNameInput" type="text" value="">
      </label>
      <label>
        <span>黒スコア</span>
        <input id="blackScoreInput" type="number" value="0">
      </label>
      <label>
        <span>白スコア</span>
        <input id="whiteScoreInput" type="number" value="0">
      </label>
      <label>
        <span>棋譜ファイル</span>
        <select id="matchFileSelect">
          <option value="">(未選択)</option>
        </select>
      </label>
    </div>

    <div class="meta-actions">
      <button id="refreshMatchesBtn">棋譜一覧更新</button>
      <button id="applyMetaBtn" class="primary">表示へ反映</button>
    </div>
  </section>

  <section class="info-card">
    <p>OBS Browser Source</p>
    <code>http://localhost:3000/</code>
    <p>この操作画面</p>
    <code>http://localhost:3000/control.html</code>
    <p>GitHub / ローカルで棋譜を置くフォルダ</p>
    <code>/matches/</code>
  </section>
</main>
<script src="./control.js"></script>
</body>
</html>
